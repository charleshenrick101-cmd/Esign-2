<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Instalar ESIGN</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #080a0f;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
      color: #fff;
    }
    .card {
      width: min(90%, 420px);
      padding: 40px 30px;
      text-align: center;
      background: #11141b;
      border: 1px solid #242936;
      border-radius: 24px;
      box-shadow: 0 20px 60px rgba(0,0,0,.45);
    }
    .icon {
      width: 80px;
      height: 80px;
      margin: 0 auto 22px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #007aff, #0051d5);
      border-radius: 20px;
      font-size: 38px;
    }
    h1 { margin: 0 0 10px; font-size: 30px; }
    p { color: #9ca3af; line-height: 1.6; margin: 0 0 28px; }
    .install-button {
      display: block;
      width: 100%;
      padding: 16px;
      border-radius: 14px;
      background: linear-gradient(135deg, #007aff, #0051d5);
      color: white;
      text-decoration: none;
      font-size: 17px;
      font-weight: 700;
      transition: .2s;
    }
    .install-button:hover { transform: translateY(-2px); }
    .footer { margin-top: 22px; font-size: 12px; color: #626975; }
  </style>
</head>
<body>
  <main class="card">
    <div class="icon">✍️</div>
    <h1>ESIGN</h1>
    <p>Instale o ESIGN no seu dispositivo iOS através do botão abaixo.</p>
    <a class="install-button"
       href="itms-services://?action=download-manifest&url=https://website.khoindvn.io.vn/plists/hpcdeagiebej.plist">
      📲 Instalar ESIGN
    </a>
    <div class="footer">Compatível com dispositivos iOS</div>
  </main>
</body>
</html>
